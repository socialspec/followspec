publishers:
  heading: For publishers
  lede: From personal websites to CMS platforms
  description: |
    Share followed feeds to help your community make new connections.

    - Create an [OPML subscription list](https://opml.org/spec2.opml#subscriptionLists)
    - Publish it at `/.well-known/following.opml`
    - Allow [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS) requests

    That's it. That's the entire spec (so far).
  cta:
    label: Join the RFC &rightarrow;
    href: https://github.com/socialspec/followspec.org

subscribers:
  heading: For subscribers
  lede: From RSS feed readers to next-gen social experiences
  description: |
    Help users discover recommended feeds from websites they trust.

    - Discovery is a single `HTTP GET` request
    - Parse responses using standard XML libraries
    - Display feeds in "Following" tabs

    That's it. That's the entire spec (so far).
  cta:
    label: Join the RFC &rightarrow;
    href: https://github.com/socialspec/followspec.org
