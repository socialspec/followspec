<header id='hero'>
    <style class='component'>
        header#hero>content-container {
            padding-block: 48px 0;
            text-align: center;
        }

        header#hero>content-container>.eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 32px;
            margin-bottom: 18px;
            padding-inline: 14px;
            border: 1.5px dashed var(--color-ink);
            border-radius: 999px;
            background: color-mix(in srgb, var(--color-ink) 15%, transparent);
            color: var(--color-ink);
            font: 500 .72rem/1.3 var(--font-mono);
            letter-spacing: .14em;
            text-decoration: none;
            text-transform: uppercase;
        }

        header#hero>content-container>.eyebrow svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        header#hero>content-container>.eyebrow:hover {
            background: color-mix(in srgb, var(--color-ink) 22%, transparent);
        }

        header#hero>content-container>h1 {
            width: min(960px, calc(100% - var(--gutter-4x)));
            margin: 0 auto 18px;
        }

        header#hero > content-container > p {
            width: min(700px, calc(100% - var(--gutter-8x)));
            margin-inline: auto;
        }

        header#hero .profile-stage {
            container: hero / normal;
            --spec-buttons-layout: vertical;
            --spec-request-layout: vertical;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-content: center;
            gap: 32px 40px;
            padding-top: 42px;
            padding-bottom: 72px;
            text-align: initial;
        }

        header#hero .profile-stage social-widget {
            width: 100%;
            height: 550px;
            max-width: none;
            min-width: 0;
            margin: 0;
        }

        header#hero .audiences {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto;
            width: 100%;
            column-gap: 56px;
            row-gap: var(--gutter-1x);
            padding-bottom: 72px;
            text-align: initial;
        }

        header#hero .audiences article {
            display: grid;
            grid-row: span 3;
            min-width: 0;
            align-content: start;
            grid-template-rows: subgrid;
        }

        header#hero .audiences #publishers {
            text-align: right;
        }

        header#hero .audiences h2 {
            display: grid;
            grid-template-areas: "label icon";
            grid-template-columns: auto auto;
            align-items: center;
            justify-content: start;
            gap: .3em;
        }

        header#hero .audiences h2>span {
            grid-area: label;
        }

        header#hero .audiences h2>svg {
            grid-area: icon;
            width: .72em;
            height: .72em;
            fill: currentColor;
        }

        header#hero .audiences #publishers h2 {
            grid-template-areas: "icon label";
            justify-content: end;
        }

        header#hero .audience-lede {
            font-weight: 500;
        }

        header#hero .audiences p {
            line-height: 1.6;
        }

        @media (max-width: 1000px) {
            header#hero .profile-stage {
                --spec-buttons-layout: carousel;
                --spec-request-layout: horizontal;
                grid-template-columns: minmax(0, 460px);
                gap: 16px;
                max-width: 780px;
                margin-inline: auto;
                padding-top: 22px;
            }

            header#hero .profile-stage social-widget {
                justify-self: center;
            }
        }

        @media (max-width: 720px) {
            header#hero>content-container {
                padding-top: 28px;
            }

            header#hero .audiences {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            header#hero .audiences #publishers {
                text-align: left;
            }

            header#hero .audiences #subscribers {
                text-align: right;
            }

            header#hero .audiences #publishers h2 {
                grid-template-areas: "label icon";
                justify-content: start;
            }

            header#hero .audiences #subscribers h2 {
                grid-template-areas: "icon label";
                justify-content: end;
            }
        }
    </style>
    <nav ht-include='fragments/nav'></nav>
    <content-container ht-with='${ page.profile } as profile'>
        <a ht-apply class='eyebrow' href='${ page.eyebrow.href }'>
            <span ht-apply>
                ${ page.eyebrow.label }
            </span>
            <svg ht-include='fragments/icons/up-right-from-square-solid-full.svg' aria-hidden='true'></svg>
        </a>
        <h1 ht-apply>
            ${ page.hero.title }
        </h1>
        <p ht-apply>
            ${ markdown(page.hero.description, "") }
        </p>
        <section class='profile-stage'>
            <spec-buttons ht-include='fragments/spec-buttons'></spec-buttons>
            <spec-request ht-include='fragments/spec-request'></spec-request>
            <social-widget ht-include='fragments/social-widget'></social-widget>
        </section>
        <section class='audiences'>
            <article ht-each='audience in ${ page.audiences }' id='${ audience.id }'>
                <h2>
                    <span ht-apply>
                        ${ audience.title }
                    </span>
                    <svg ht-include='fragments/icons/cloud-arrow-up-solid-full.svg' ht-if='${ audience.id } == "publishers"' aria-hidden='true'></svg>
                    <svg ht-include='fragments/icons/cloud-arrow-down-solid-full.svg' ht-if='${ audience.id } == "subscribers"' aria-hidden='true'></svg>
                </h2>
                <p ht-apply class='audience-lede'>
                    ${ audience.lead }
                </p>
                <p ht-apply>
                    ${ markdown(audience.description) }
                </p>
            </article>
        </section>
    </content-container>
</header>
