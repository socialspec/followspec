<footer class='site-footer' data-color-scheme='dark'>
    <style class='component'>
        footer.site-footer {
            display: block;
            max-width: none;
            margin: 0;
            padding: 0;
            gap: 0;
            border-top: 1px solid #343b50;
        }

        footer.site-footer>.footer-content,
        footer.site-footer>.footer-meta {
            width: var(--container-width);
            margin: 0 auto;
        }

        footer.site-footer>.footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px 64px;
            align-items: flex-start;
            padding-block: 56px 40px;
        }

        footer.site-footer .footer-intro {
            display: flex;
            flex: 999 1 320px;
            flex-direction: column;
            gap: 10px;
        }

        footer.site-footer .footer-brand {
            display: flex;
            align-items: center;
            color: inherit;
            text-decoration: none;
        }

        footer.site-footer p {
            max-width: 340px;
            margin: 0;
            color: #d3d7e0;
            line-height: 1.6;
        }

        footer.site-footer .footer-links {
            display: flex;
            flex: 1 1 180px;
            flex-direction: column;
            gap: 4px;
        }

        footer.site-footer .footer-links>div {
            padding-bottom: 10px;
            color: #b7bdcb;
            font-family: "Fira Mono", ui-monospace, monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        footer.site-footer .footer-links>a {
            display: flex;
            align-items: center;
            min-height: 36px;
            color: inherit;
            text-decoration: none;
        }

        footer.site-footer .footer-links[data-markers="true"]>a {
            gap: 10px;
        }

        footer.site-footer .footer-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #7a3e9d;
        }

        footer.site-footer .footer-links [data-color="green"] .footer-marker {
            background: #2f7d3a;
        }

        footer.site-footer .footer-links [data-color="yellow"] .footer-marker {
            background: #e8b12a;
        }

        footer.site-footer>.footer-makehypertext {
            display: block;
            width: var(--container-width);
            margin: 0 auto;
            padding-bottom: 32px;
            color: var(--color-white);
        }

        footer.site-footer>.footer-makehypertext svg {
            display: block;
            width: 100%;
            height: auto;
            fill: currentColor;
        }

        footer.site-footer>.footer-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
            justify-content: space-between;
            padding-block: 20px 36px;
            border-top: 1px solid #343b50;
            color: #b7bdcb;
            font-size: 13px;
        }

        footer.site-footer .footer-meta a {
            color: inherit;
            font-family: "Fira Mono", ui-monospace, monospace;
        }

    </style>
    <div class='footer-content'>
        <div class='footer-intro'>
            <a ht-apply class='footer-brand' href='${ data.nav.footer.title.href }' aria-label='${ site.title } Home'>
                <logo-horizontal ht-include='fragments/logo-horizontal' ht-with='${ site.brand, theme.data.brand.id } as brand'></logo-horizontal>
            </a>
            <p ht-apply>
                ${ data.nav.footer.description }
            </p>
        </div>
        <nav ht-each='group in ${ data.nav.footer.groups }' class='footer-links' data-markers='${ group.markers, false }'
            aria-label='${ group.label }'>
            <div ht-apply>
                ${ group.label }
            </div>
            <a ht-each='link in ${ group.links }' ht-apply href='${ link.href }' data-color='${ link.color, "" }'>
                <span ht-if='${ group.markers } == true' class='footer-marker'></span>
                <span ht-apply>
                    ${ link.label }
                </span>
            </a>
        </nav>
    </div>
    <a class='footer-makehypertext' href='https://makehypertext.com' aria-label='Make Hypertext'>
        <svg ht-include='fragments/makehypertext.svg'></svg>
    </a>
    <div class='footer-meta'>
        <div ht-apply>
            ${ data.nav.footer.meta.message }
        </div>
        <a ht-apply href='${ data.nav.footer.meta.href, data.nav.footer.meta.path, "#" }'
            target='_blank'>
            ${ markdown(data.nav.footer.meta.generator, data.nav.footer.meta.path, "") }
        </a>
    </div>
</footer>
