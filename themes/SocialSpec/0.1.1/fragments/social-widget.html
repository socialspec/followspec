<!--`profile` is the complete, page-owned social-widget contract.-->
<social-widget ht-with='${ page.profile } as profile' data-spec='${ profile.active_spec }' active-tab='${ profile.default_tab }'>
    <style>
        social-widget {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 740px;
            margin: auto;
            overflow: hidden;
            border: 1px solid var(--color-line);
            border-radius: 18px;
            background: var(--color-white);
            box-shadow: 0 18px 40px #171c2b14;
        }

        social-widget .profile-cover {
            flex: none;
            height: 96px;
            background: #2c3248;
        }

        social-widget p { font-size: 0.9rem; margin-bottom: var(--gutter-1x); }

        social-widget[data-spec="following"] .profile-cover {
            background: #4a315c;
        }

        social-widget[data-spec="contact"] .profile-cover {
            background: #274c32;
        }

        social-widget[data-spec="about"] .profile-cover {
            background: #64501c;
        }

        social-widget .profile-summary {
            flex: none;
            display: grid;
            grid-template-columns: auto 1fr;
            column-gap: 16px;
            row-gap: 0;
            align-items: start;
            padding: 0 20px 4px;
        }

        social-widget .profile-avatar {
            display: grid;
            width: 96px;
            height: 96px;
            margin-top: -40px;
            place-items: center;
            border: 4px solid var(--color-white);
            border-radius: 16px;
            background: #f1e8f5;
            font-size: 54px;
        }

        social-widget .profile-actions {
            display: flex;
            grid-column: 2;
            gap: 8px;
            justify-self: end;
            margin-top: 14px;
        }

        social-widget .profile-actions button,
        social-widget .profile-actions a,
        social-widget .profile-feed button {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            padding: 0 14px;
            cursor: pointer;
            border: 1.5px solid var(--color-ink);
            border-radius: 999px;
            background: var(--color-white);
            color: var(--color-ink);
            font: 700 .82rem var(--font-sans);
            text-decoration: none;
        }

        social-widget [data-follow-toggle][data-following="true"] {
            border-color: var(--color-ink);
            background: var(--color-ink);
            color: var(--color-white);
        }

        social-widget .profile-actions .dm-button {
            width: 40px;
            justify-content: center;
            padding: 0;
            border-color: var(--color-green);
            background: #e6f0e7;
            color: #235e2c;
        }

        social-widget .dm-button svg,
        social-widget .contact-action svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        social-widget .profile-identity {
            grid-column: 1 / -1;
        }

        social-widget .profile-identity h2 {
            margin-top: 12px;
            font-size: 22px;
        }

        social-widget .profile-identity p {
            max-width: none;
            margin-top: 4px;
            line-height: 1.45;
        }

        social-widget .profile-identity p:first-of-type {
            color: var(--color-slate);
            font: 500 .78rem var(--font-mono);
        }

        social-widget .profile-tabs {
            flex: none;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 0 12px;
            border-top: 1px solid var(--color-line);
            border-bottom: 1px solid var(--color-line);
            scrollbar-width: thin;
        }

        social-widget .profile-tab {
            flex: none;
            min-height: 44px;
            padding: 0 9px;
            cursor: pointer;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: var(--color-slate);
            font: 700 .88rem var(--font-sans);
        }

        social-widget[active-tab="posts"] .profile-tab[data-profile-tab="posts"],
        social-widget[active-tab="following"] .profile-tab[data-profile-tab="following"],
        social-widget[active-tab="about"] .profile-tab[data-profile-tab="about"],
        social-widget[active-tab="contact"] .profile-tab[data-profile-tab="contact"] {
            border-bottom-color: var(--color-purple);
            color: var(--color-ink);
        }

        social-widget[data-spec="contact"][active-tab="contact"] .profile-tab[data-profile-tab="contact"] {
            border-bottom-color: var(--color-green);
        }

        social-widget[data-spec="about"][active-tab="about"] .profile-tab[data-profile-tab="about"] {
            border-bottom-color: #b7830d;
        }

        social-widget .profile-panels {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            padding: 0;
        }

        social-widget .profile-panel {
            display: none;
            padding: 0 20px 22px;
        }

        social-widget .profile-panel[hidden] {
            display: none !important;
        }

        social-widget[active-tab="posts"] .profile-panel[data-profile-panel="posts"],
        social-widget[active-tab="following"] .profile-panel[data-profile-panel="following"],
        social-widget[active-tab="about"] .profile-panel[data-profile-panel="about"],
        social-widget[active-tab="contact"] .profile-panel[data-profile-panel="contact"] {
            display: block;
        }

        social-widget .profile-about {
            padding-top: 16px;
        }

        social-widget .profile-about > :first-child {
            margin-top: 0;
        }

        social-widget .profile-about img {
            display: block;
            max-width: 100%;
            margin: 16px 0;
            border-radius: 12px;
        }

        social-widget .profile-post {
            padding: 16px 0;
            border-bottom: 1px solid #eae5da;
        }

        social-widget .profile-post:last-child {
            border: 0;
        }

        social-widget .profile-post time {
            display: block;
            margin-bottom: 5px;
            color: var(--color-slate);
            font: 500 .72rem var(--font-mono);
        }

        social-widget .profile-post h3 {
            font-size: 1.2rem;
        }

        social-widget .profile-post p {
            margin-top: 4px;
            line-height: 1.5;
        }

        social-widget .profile-feed,
        social-widget .profile-contact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eae5da;
        }

        social-widget .profile-feed:last-child,
        social-widget .profile-contact:last-child {
            border: 0;
        }

        social-widget .feed-icon {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            overflow: hidden;
            border-radius: 50%;
            background: #f1e8f5;
            color: var(--color-purple);
            font-size: 0;
            text-align: center;
        }

        social-widget .feed-icon svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        social-widget .feed-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        social-widget .profile-feed span:nth-child(2),
        social-widget .profile-contact span {
            display: grid;
            gap: 3px;
        }

        social-widget .profile-feed small,
        social-widget .profile-contact small {
            color: var(--color-slate);
            font: 500 .7rem var(--font-mono);
        }

        social-widget .profile-feed button {
            min-height: 34px;
            margin-left: auto;
            font-size: .75rem;
        }

        social-widget .profile-links {
            display: flex;
            gap: 16px;
            color: #685013;
            font-weight: 700;
        }

        social-widget .profile-contact .contact-action {
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            border: 1px solid #b9e2c8;
            border-radius: 999px;
            background: #e3f5ea;
            color: #235e2c;
            font-weight: 700;
        }

        social-widget .profile-actions [hidden] {
            display: none !important;
        }

        @media (max-width: 720px) {
            social-widget .profile-summary {
                padding-right: 16px;
                padding-left: 16px;
            }

        }
    </style>
    <div class='profile-cover'></div>
    <div class='profile-summary'>
        <div ht-apply class='profile-avatar' role='img' aria-label='Profile photo'>
            ${ profile.avatar }
        </div>
        <div class='profile-actions'>
            <a ht-apply ht-if='${ profile.dm }' class='dm-button' data-profile-dm='' href='mailto:${ profile.dm }' title='DM ${ profile.dm }' aria-label='DM ${ profile.dm }'>
                <svg ht-include='fragments/icons/message-dots-regular-full.svg' aria-hidden='true'></svg>
                <span class='visually-hidden'>
                    DM
                </span>
            </a>
            <button class='follow-button' type='button' aria-pressed='false' data-follow-toggle='' data-following='false'>
                Follow
            </button>
        </div>
        <div class='profile-identity'>
            <h2 ht-apply>
                ${ profile.name }
            </h2>
            <p ht-apply>
                ${ profile.handle }
            </p>
            <p ht-apply>
                ${ profile.summary }
            </p>
        </div>
    </div>
    <div class='profile-tabs' role='tablist' aria-label='Profile sections'>
        <button ht-each='tab in ${ profile.tabs }' ht-apply class='profile-tab' type='button' role='tab' aria-selected='false' aria-controls='profile-panel-${ tab.id }' data-profile-tab='${ tab.id }'>
            ${ tab.label }
        </button>
    </div>
    <div class='profile-panels' aria-live='polite'>
        <section id='profile-panel-posts' class='profile-panel' role='tabpanel' data-profile-panel='posts'>
            <article ht-each='post in ${ profile.posts }' class='profile-post'>
                <time ht-apply>
                    ${ post.date }
                </time>
                <h3 ht-apply>
                    ${ post.title }
                </h3>
                <p ht-apply>
                    ${ post.blurb }
                </p>
            </article>
        </section>
        <section id='profile-panel-following' class='profile-panel' role='tabpanel' data-profile-panel='following'>
            <article ht-each='feed in ${ profile.following }' class='profile-feed'>
                <span class='feed-icon'>
                    <img ht-apply ht-if='${ feed.favicon_url }' src='${ feed.favicon_url }' alt=''>
                    <svg ht-include='fragments/icons/square-rss-solid-full.svg' ht-if='!${ feed.favicon_url }' aria-hidden='true'></svg>
                </span>
                <span>
                    <strong ht-apply>
                        ${ feed.name }
                    </strong>
                    <small ht-apply>
                        @${ feed.host }
                    </small>
                </span>
                <button ht-apply type='button' data-follow-toggle='' data-following='${ feed.following }' aria-pressed='${ feed.following }'>
                    <span ht-if='${ feed.following }'>
                        Following
                    </span>
                    <span ht-if='!${ feed.following }'>
                        Follow
                    </span>
                </button>
            </article>
        </section>
        <section id='profile-panel-about' class='profile-panel' role='tabpanel' data-profile-panel='about'>
            <div ht-if='${ profile.about }' ht-apply class='profile-about'>
                ${ markdown(profile.about) }
            </div>
        </section>
        <section id='profile-panel-contact' class='profile-panel' role='tabpanel' data-profile-panel='contact'>
            <article ht-each='item in ${ profile.contact }' class='profile-contact'>
                <span>
                    <small ht-apply>
                        ${ item.kind}
                    </small>
                    <strong ht-apply>
                        ${ item.value }
                    </strong>
                </span>
                <a ht-apply ht-if='${ item.href }' class='contact-action' href='${ item.href }' title='${ item.action }'>
                    <svg ht-include='fragments/icons/envelope-regular-full.svg' ht-if='${ item.action } == "Email"' aria-hidden='true'></svg>
                    <svg ht-include='fragments/icons/up-right-from-square-solid-full.svg' ht-if='${ item.action } != "Email"' aria-hidden='true'></svg>
                    <span ht-apply class='visually-hidden'>
                        ${ item.action }
                    </span>
                </a>
            </article>
        </section>
    </div>
</social-widget>
