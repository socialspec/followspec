<!DOCTYPE html>
<html lang='en'>
<head>
    <meta ht-include='fragments/head'>
    <meta name='layout:name' content='post'>
    <style ht-pipe='from "style.component" as css' id='components'></style>
    <style id='layout'>
        .post-hero {
            background: var(--color-ink);
            color: var(--color-white);
        }

        .post-hero>content-container {
            display: grid;
            gap: 22px;
            padding-block: 52px 60px;
        }

        .post-hero .all-posts {
            width: max-content;
            color: #d3d7e0;
            font-weight: 600;
            text-decoration: none;
        }

        .post-hero .all-posts:hover {
            color: var(--color-white);
        }

        .post-hero h1 {
            max-width: 920px;
            color: var(--color-white);
            overflow-wrap: anywhere;
        }

        .post-hero .post-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            color: #b7bdcb;
            font: 500 .8125rem var(--font-mono);
        }

        .post-content {
            box-sizing: border-box;
            grid-template-columns: minmax(0, 720px);
            justify-content: center;
            width: 100%;
            margin: 0;
            padding: 56px var(--container-gutter) 80px;
        }

        .post-content> :first-child {
            color: var(--color-ink);
            line-height: 1.6;
        }

        @media (max-width: 720px) {
            .post-hero>content-container {
                padding-block: 36px 44px;
            }

            .post-content {
                padding-block: 40px 56px;
            }

        }
    </style>
</head>

<body class='post-page'>
    <header>
        <nav ht-include='fragments/nav' data-color-scheme='dark'></nav>
        <section class='post-hero' data-color-scheme='dark'>
            <content-container>
                <a class='all-posts' href='/blog/'>
                    ← All posts
                </a>
                <h1 ht-apply>
                    ${ page.title }
                </h1>
                <p ht-apply>
                    ${ page.description }
                </p>
                <div class='post-meta'>
                    <span ht-each='tag in ${ page.tags }' ht-apply>${ tag }</span>
                    <time ht-apply datetime='${ page.created_at }'>${ page.date }</time>
                    <span aria-hidden='true'>·</span>
                    <span ht-apply>${ reading_time(page.wordcount) }</span>
                    <span aria-hidden='true'>·</span>
                    <span ht-apply>${ page.byline.name }</span>
                </div>
            </content-container>
        </section>
    </header>
    <main>
        <article ht-apply class='post-content' data-color-scheme='light'>
            ${ markdown(page.content) }
        </article>
        <section ht-include='fragments/open-source' data-color-scheme='smoke'></section>
    </main>
    <footer ht-include='fragments/footer'></footer>
</body>

</html>
